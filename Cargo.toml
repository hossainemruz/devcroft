[package]
name = "devcroft"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
async-channel = "2.5"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gix = { version = "0.87.1", default-features = false, features = ["parallel", "revision", "sha1", "status"] }
# Pinned to upstream main (2026-09-14); was a fork branch with a single
# heading line-height tweak that did not justify maintaining the fork.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit.git", rev = "501c73923280859a5de2b16fe64d4aac960bb040" }
ignore = "0.4.33"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "5988a0b78b4aa804d1c12e66bbfe662bd97d81c0", default-features = false }
markdown = "1.0"
parking_lot = "0.12"
portable-pty = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
similar = "3.2.0"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }

[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit.git", rev = "501c73923280859a5de2b16fe64d4aac960bb040", features = ["test-support"] }
tempfile = "3.27.0"

[profile.dev]
debug = "limited"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
libghostty-vt = { opt-level = 3 }
libghostty-vt-sys = { opt-level = 3 }
# Per-frame text/render hot path. The terminal reshapes fresh glyph runs on
# every present (syntax-highlighted redraws), and at dev opt-level 0 the
# shaping stack alone costs ~10ms per full frame — enough to floor picker
# navigation at ~20Hz while input arrives at ~30Hz. Optimizing these
# dependencies costs one-time build minutes and keeps incremental rebuilds
# fast (the top-level crate stays unoptimized).
gpui-pre-linux = { opt-level = 3 }
gpui-pre-wgpu = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
swash = { opt-level = 3 }
skrifa = { opt-level = 3 }
harfrust = { opt-level = 3 }
read-fonts = { opt-level = 3 }
fontdb = { opt-level = 3 }
unicode-bidi = { opt-level = 3 }
unicode-linebreak = { opt-level = 3 }
unicode-script = { opt-level = 3 }
unicode-segmentation = { opt-level = 3 }
