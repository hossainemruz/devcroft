[package]
name = "devcroft"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
async-channel = "2.5"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gix = { version = "0.87.1", default-features = false, features = ["parallel", "revision", "sha1", "status"] }
# The diff tool's paste editors highlight with the editor's tree-sitter
# grammars; the diff pane uses syntect (see `review::syntax`). These are the
# picker's languages that both engines can color, so a picked language means
# the same thing on both tabs. SQL is the exception: `tree-sitter-sequel`
# pins an old `cc`, which conflicts with the rest of the graph.
gpui-kit = { version = "0.6.2", features = [
  "tree-sitter",
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-csharp",
  "tree-sitter-css",
  "tree-sitter-diff",
  "tree-sitter-go",
  "tree-sitter-html",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-lua",
  "tree-sitter-make",
  "tree-sitter-markdown",
  "tree-sitter-php",
  "tree-sitter-python",
  "tree-sitter-ruby",
  "tree-sitter-rust",
  "tree-sitter-scala",
  "tree-sitter-yaml",
] }
ignore = "0.4.33"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "5988a0b78b4aa804d1c12e66bbfe662bd97d81c0", default-features = false }
markdown = "1.0"
parking_lot = "0.12"
portable-pty = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
similar = "3.2.0"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-onig"] }
tempfile = "3.27.0"

[dev-dependencies]
gpui-kit = { version = "0.6.2", features = ["test-support"] }

[profile.dev]
debug = "limited"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
libghostty-vt = { opt-level = 3 }
libghostty-vt-sys = { opt-level = 3 }
# Per-frame text/render hot path. The terminal reshapes fresh glyph runs on
# every present (syntax-highlighted redraws), and at dev opt-level 0 the
# shaping stack alone costs ~10ms per full frame — enough to floor picker
# navigation at ~20Hz while input arrives at ~30Hz. Optimizing these
# dependencies costs one-time build minutes and keeps incremental rebuilds
# fast (the top-level crate stays unoptimized).
gpui-pre-linux = { opt-level = 3 }
gpui-pre-wgpu = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
swash = { opt-level = 3 }
# Diff highlighting: syntect parses every line of a review file or a pasted
# document. At dev opt-level 0 it is an order of magnitude slower, which the
# diff tool pays on every comparison and every language switch.
syntect = { opt-level = 3 }
# `regex-onig` (see the dependency above) is compiled C; optimize it too.
onig_sys = { opt-level = 3 }
skrifa = { opt-level = 3 }
harfrust = { opt-level = 3 }
read-fonts = { opt-level = 3 }
fontdb = { opt-level = 3 }
unicode-bidi = { opt-level = 3 }
unicode-linebreak = { opt-level = 3 }
unicode-script = { opt-level = 3 }
unicode-segmentation = { opt-level = 3 }
