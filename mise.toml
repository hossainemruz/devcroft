min_version = "2026.8.0"

[tools]
rust = { version = "1.97.1", profile = "default" }
zig = "0.16.0"

[tasks.build]
description = "Build Devcroft"
run = "cargo build"

[tasks.app]
description = "Run Devcroft GUI"
run = "cargo run -- app"

[tasks.preview]
description = "Preview a file in a dialog"
usage = 'arg "<path>" help="File to preview"'
run = 'cargo run -- preview "${usage_path?}"'

[tasks.install]
description = "Install Devcroft as a desktop app, replacing the old Electron install (Linux + macOS)"
usage = 'flag "--debug" help="Install a debug build instead of release"'
run = "./scripts/install-app.sh ${usage_debug:+--debug}"

[tasks.check]
description = "Run formatting, compilation, and lints"
run = [
  "cargo fmt --all -- --check",
  "cargo check",
  "cargo clippy --all-targets -- -D warnings",
]

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.test]
description = "Run tests"
run = "cargo test"
