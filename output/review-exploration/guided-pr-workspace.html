        <section class="dc-overview" data-view="overview" hidden><div class="dc-eyebrow">Review orientation</div><h2>One payment. Several attempts.</h2><p class="dc-lead">This change moves payment identity outside the retry loop, caps attempts, and separates transient failures from permanent rejection.</p><div class="dc-notice">Start with payment identity: a successful charge with a lost response is the case where retrying can have a second financial effect.</div><button class="dc-overview-row cursor-interaction" data-chapter="0"><strong>01 &nbsp; Preserve payment identity →</strong><span>Inspect the lifetime of the idempotency key.</span></button><button class="dc-overview-row cursor-interaction" data-chapter="1"><strong>02 &nbsp; Bound retry attempts →</strong><span>Check attempts, backoff, and cancellation.</span></button><button class="dc-overview-row cursor-interaction" data-chapter="2"><strong>03 &nbsp; Stop on permanent errors →</strong><span>Follow the classification of declined requests.</span></button><div class="dc-notice">Missing context: the payment provider’s deduplication window. The guide cannot establish that contract from this example source.</div><button class="cursor-interaction" data-page="changes">Inspect all changes</button></section>
