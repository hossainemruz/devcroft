min_version = "2026.8.0"

[tools]
rust = { version = "1.97.1", profile = "default" }
zig = "0.16.0"

[tasks.build]
description = "Build Devcroft"
run = "cargo build"

[tasks.app]
description = "Run Devcroft"
run = "cargo run"

[tasks.check]
description = "Run formatting, compilation, and lints"
run = [
  "cargo fmt --all -- --check",
  "cargo check",
  "cargo clippy --all-targets -- -D warnings",
]

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.test]
description = "Run tests"
run = "cargo test"
